services:
  - type: web
    name: school-timetable-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: school-timetable-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://time-table-website.vercel.app
      - key: PYTHONPATH
        value: /opt/render/project/src

databases:
  - name: school-timetable-db
    databaseName: school_timetable
    plan: free
