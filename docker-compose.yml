services:
  db:
    image: postgres:16
    container_name: school-timetable-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_timetable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_timetable"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-timetable-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/school_timetable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-timetable-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
